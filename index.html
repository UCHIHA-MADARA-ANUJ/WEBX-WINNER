<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEBX — The Evolution Engine</title>
  <meta name="description" content="A website with no fixed interface. Its structure is rebuilt around how each visitor moves." />
  <meta name="theme-color" content="#0b0c0f" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b0c0f' stroke='%23ff6a3d' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff6a3d'/%3E%3C/svg%3E" />
</head>
<body data-mode="chronicle">
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">WEBX</span>
      <span class="brand-sub">Evolution Engine</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <button type="button" class="nav-chip" data-goto="manifesto">Manifesto</button>
      <button type="button" class="nav-chip" data-goto="work">Work</button>
      <button type="button" class="nav-chip" data-goto="method">Method</button>
      <button type="button" class="nav-chip" data-goto="journal">Journal</button>
      <button type="button" class="nav-chip" data-goto="contact">Contact</button>
    </nav>
    <div class="header-end">
      <span class="gen" id="gen">Gen 0</span>
      <button type="button" class="ghost" data-palette title="Command palette (/)">/ Command</button>
      <button type="button" class="ghost" data-observer title="What the engine sees">Observer</button>
    </div>
  </header>

  <main id="stage" class="stage" aria-live="off"></main>

  <footer class="dock" aria-label="Structure selector">
    <div class="dock-info">
      <span class="dock-label">Current structure</span>
      <strong id="mode-name">Chronicle</strong>
      <span class="dock-blurb" id="mode-blurb"></span>
    </div>
    <div class="dock-modes" role="group" aria-label="Structures">
      <button type="button" data-mode="chronicle">Chronicle</button>
      <button type="button" data-mode="atlas">Atlas</button>
      <button type="button" data-mode="terminal">Terminal</button>
      <button type="button" data-mode="index">Index</button>
      <button type="button" data-mode="deck">Deck</button>
    </div>
    <button type="button" class="ghost" id="auto" data-auto aria-pressed="true">Auto-evolve: on</button>
  </footer>

  <div class="veil" id="veil" aria-hidden="true"><div class="veil-text">Rebuilding structure</div><div class="veil-bar"></div></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <aside class="observer" id="observer" hidden aria-label="Observer">
    <header class="observer-head">
      <span>Observer</span>
      <button type="button" class="ghost" data-close-observer aria-label="Close">✕</button>
    </header>
    <p class="dim small observer-intro">Everything the engine knows about you, live. Nothing leaves this browser.</p>
    <div id="observer-body"></div>
  </aside>

  <dialog class="win" id="detail" aria-labelledby="detail-body">
    <div class="win-body" id="detail-body"></div>
    <button type="button" class="ghost win-close" data-close-detail>Close ✕</button>
  </dialog>

  <dialog class="win palette" id="palette" aria-label="Command palette">
    <div class="palette-head"><span class="panel-tag">Command palette</span><button type="button" class="ghost" data-close-palette>Esc</button></div>
    <div id="palette-body"></div>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
